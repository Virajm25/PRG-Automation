<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRG Drawing Data Extractor</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--panel2:#f8fafc;--ink:#18222d;--mut:#5d6b79;--line:#dde3ea;--brand:#1f5f99;--brand-ink:#fff;--brand-soft:#e7f0f9;
 --ok:#1d7a45;--ok-soft:#e5f4ea;--warn:#9a6200;--warn-soft:#fdf2dc;--bad:#b23b3b;--bad-soft:#fbe9e9;--shadow:0 1px 2px #0000000d,0 2px 8px #0000000a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11161c;--panel:#19212a;--panel2:#1e2731;--ink:#e5ebf1;--mut:#93a1af;--line:#2c3845;
 --brand:#5ea4e6;--brand-ink:#0b1622;--brand-soft:#1d3247;--ok:#55c487;--ok-soft:#173326;--warn:#e3a94a;--warn-soft:#3a2c12;--bad:#ee7b7b;--bad-soft:#3b1d1d;--shadow:none}}
:root[data-theme=dark]{--bg:#11161c;--panel:#19212a;--panel2:#1e2731;--ink:#e5ebf1;--mut:#93a1af;--line:#2c3845;--brand:#5ea4e6;--brand-ink:#0b1622;--brand-soft:#1d3247;
 --ok:#55c487;--ok-soft:#173326;--warn:#e3a94a;--warn-soft:#3a2c12;--bad:#ee7b7b;--bad-soft:#3b1d1d;--shadow:none}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn:focus-visible,.navi:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
input[type=search],input[type=text],select{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
/* header */
header.app{height:48px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--brand);cursor:pointer}
.logo svg{width:22px;height:22px}
.crumb{color:var(--mut);display:flex;align-items:center;gap:8px;min-width:0}
.crumb b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sp{flex:1}
/* layout */
.shell{flex:1;display:flex;min-height:0}
nav.side{width:232px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 8px;display:none}
nav.side.on{display:block}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:12px 10px 5px}
.navi{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink);border:0;background:none;width:100%;text-align:left}
.navi:hover{background:var(--brand-soft)}
.navi.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.navi .num{margin-left:auto;font-size:11px;color:var(--mut);font-weight:400}
.navi .rv{font-size:10.5px;background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:0 6px;font-weight:600}
.navi .ix{width:18px;color:var(--mut);font-size:11px;text-align:right;flex-shrink:0}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.view{flex:1;overflow:auto;padding:18px 22px}
.view.tablev{display:flex;flex-direction:column;overflow:hidden;padding:14px 18px 10px}
h1.t{font-size:19px;margin:0 0 3px}
.lead{color:var(--mut);margin:0 0 14px;max-width:900px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--brand)}
.card h3{margin:0 0 4px;font-size:14px}
.card .meta{color:var(--mut);font-size:12px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:24px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--mut);font-size:12px}
.kpi .r{font-size:11.5px;margin-top:4px}
.r.ok{color:var(--ok)}.r.warn{color:var(--warn)}
.sec{margin:22px 0 10px;font-size:14px;font-weight:600}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:1100px){.row2{grid-template-columns:1fr}}
/* doc list */
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;background:var(--panel);transition:.15s}
.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop b{font-size:14px}
.doc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.doc:first-child{border-top:0}
.doc .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .msg{grid-column:1/-1;color:var(--mut);font-size:12px}
.prog{height:5px;border-radius:3px;background:var(--line);overflow:hidden;grid-column:1/-1}
.prog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.done{background:var(--ok-soft);color:var(--ok)}.pill.error{background:var(--bad-soft);color:var(--bad)}
.pill.processing,.pill.queued,.pill.ai{background:var(--warn-soft);color:var(--warn)}
.pill.src{background:var(--panel2);color:var(--mut);border-color:var(--line);font-weight:500}
.pill.src.rev{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.bars div{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.bars span{width:190px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars i{height:8px;background:var(--brand);border-radius:4px;display:block}
/* toolbar + table */
.subtabs{display:flex;gap:4px;margin:8px 0 10px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:16px;cursor:pointer}
.subtabs button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tools input[type=search]{width:260px}
.tools .cnt{color:var(--mut);margin-left:auto}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);user-select:none}
.toggle input{margin:0}
.toggle.on{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.hint{color:var(--mut);font-size:12px;margin:-2px 0 8px}
.work{flex:1;display:flex;gap:0;min-height:0}
.tbl{flex:1;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;background:var(--panel2);color:var(--ink);text-align:left;padding:7px 9px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line);z-index:1;cursor:pointer;font-size:12px}
th:hover{color:var(--brand)}
th .ar{color:var(--brand);font-size:10px}
td{border-bottom:1px solid var(--line);padding:6px 9px;vertical-align:top;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.wrap td{white-space:normal;word-break:break-word;max-width:420px}
td[contenteditable]:focus{white-space:normal;overflow:visible;word-break:break-word}
tbody tr:hover td{background:var(--brand-soft)}
tr.review td:first-child{box-shadow:inset 3px 0 var(--warn)}
tr.spare td{color:var(--mut);font-style:italic}
td[contenteditable]{cursor:text}
td[contenteditable]:focus{outline:2px solid var(--brand);outline-offset:-2px;background:var(--panel)}
td.saved{animation:flash 1s}
@keyframes flash{0%{background:var(--ok-soft)}100%{background:transparent}}
td.lnk{color:var(--brand);cursor:pointer;font-weight:600;white-space:nowrap}
td.lnk:hover{text-decoration:underline}
td.act{width:1%;white-space:nowrap}
td.act .btn{opacity:0}tr:hover td.act .btn{opacity:1}
.empty{padding:60px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
.more{padding:10px;text-align:center}
/* preview */
.split{width:6px;cursor:col-resize;flex-shrink:0;display:none}
.split.on{display:block}
.prev{width:46%;min-width:320px;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:none;flex-direction:column}
.prev.on{display:flex}
.prev header{padding:7px 9px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prev header b{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev .img{flex:1;overflow:auto;background:#fff}
.prev img{width:100%;display:block}
.prev.full{position:fixed;inset:48px 0 26px 0;width:auto;z-index:8;border-radius:0}
/* modal, toast, status */
.modal{position:fixed;inset:0;background:#0f172a66;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:520px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px #0003}
.dlg h3{margin:0 0 4px;font-size:16px}
.dlg label.f{display:block;margin:12px 0 4px;color:var(--mut);font-size:12px}
.dlg input[type=text]{width:100%}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.chk{display:flex;align-items:center;gap:8px;padding:4px 2px}
.chk span{color:var(--mut);margin-left:auto;font-size:12px}
.fmt{display:flex;gap:8px;flex-wrap:wrap}
.fmt label{border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.fmt label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.cols2{columns:2;column-gap:18px}
@media (max-width:640px){.cols2{columns:1}}
.menu{position:relative;display:inline-block}.menu .dd{display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:6;min-width:150px;box-shadow:0 6px 20px #0002;overflow:hidden}
.menu.open .dd{display:block}.dd button{display:block;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer}.dd button:hover{background:var(--brand-soft)}
.toast{position:fixed;bottom:36px;right:16px;background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:8px;display:none;z-index:30;max-width:440px;box-shadow:0 6px 20px #0003}
footer.status{height:26px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--panel);border-top:1px solid var(--line);color:var(--mut);font-size:11.5px}
footer .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--mut)}
footer .dot.ok{background:var(--ok)}footer .dot.warn{background:var(--warn)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px;background:var(--panel2)}
</style>
</head>
<body>
<header class="app">
  <div class="logo" onclick="goHome()" title="All projects">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h4M7 12h10M7 16h6M15 6v4"/></svg>
    <span>PRG Drawing Data Extractor</span>
  </div>
  <div class="crumb" id="crumb"></div>
  <div class="sp"></div>
  <span id="hdrActs" style="display:none;gap:8px;align-items:center">
    <button class="btn" onclick="go('drawings');file.click()" title="Upload one or more drawing PDFs">Upload PDFs</button>
    <button class="btn" id="aiBtn" onclick="aiRun()" style="display:none" title="Run the AI pass again on all drawings">Re-run AI</button>
    <button class="btn pri" onclick="openExport()" title="Export (Ctrl+E)">Export</button>
  </span>
</header>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<footer class="status">
  <span id="stAi"><span class="dot"></span>AI</span><span id="stOcr"><span class="dot"></span>OCR</span><span id="stData"></span>
  <span style="margin-left:auto"><kbd>/</kbd> search · <kbd>Esc</kbd> close · <kbd>Ctrl</kbd>+<kbd>E</kbd> export · <kbd>←</kbd><kbd>→</kbd> pages in preview</span>
</footer>
<input type="file" id="file" multiple accept=".pdf,application/pdf" style="display:none">
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(u,o){let r;try{r=await fetch(u,o)}catch(e){throw new Error("Cannot reach the application server - is it still running?")}
 const j=await r.json().catch(()=>({}));
 if(r.status==404&&!j.error&&u.startsWith("/api/"))throw new Error("The application server is older than this page. Close the app (or stop python app.py) and start it again.");
 if(!r.ok)throw new Error(j.error||r.statusText);return j}
window.addEventListener("unhandledrejection",e=>{e.preventDefault();toast((e.reason&&e.reason.message)||String(e.reason),8000)});
const JSONP=b=>({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
function toast(m,ms=3500){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",ms)}

/* -------- deliverables, following the client's scope of work -------- */
const NAV=[
 {id:"overview",label:"Overview",grp:"Project"},
 {id:"drawings",label:"Drawings & sheets",grp:"Project"},
 {id:"io",label:"I/O List",grp:"Deliverables",ix:2,tabs:[["io","I/O List"],["summary","I/O Summary"]]},
 {id:"wires",label:"Ferrule List",grp:"Deliverables",ix:3,tabs:[["wires","Ferrule List"]]},
 {id:"bom",label:"Bill of Material",grp:"Deliverables",ix:4,tabs:[["bom","BOM (totals)"],["bom_lines","BOM lines (editable)"]]},
 {id:"terminals",label:"Terminal Schedule",grp:"Deliverables",ix:5,tabs:[["terminals","Terminal Schedule"],["blocks","Terminal Blocks"]]},
 {id:"cables",label:"Cable Schedule",grp:"Deliverables",ix:6,tabs:[["cables","Cable Schedule"]]},
 {id:"devices",label:"Devices & Instruments",grp:"Deliverables",ix:7,tabs:[["devices","Device List"],["devsummary","Summary by type"],["symbols","Symbols & pins"]]},
 {id:"xref",label:"Cross Reference",grp:"Deliverables",ix:8,tabs:[["xref","Device"],["contacts","Contacts"],["coils","Coil / Contact"],["signals","Signal links"],["sheetrefs","Sheet references"]]},
 {id:"panel",label:"Panel, GA & Feeders",grp:"More data",tabs:[["panel_specs","Panel specifications"],["circuits","Feeders / Circuits"],["annotations","Sheet annotations"]]},
 {id:"learning",label:"Learned corrections",grp:"More data"}];
const DS={io:"I-O List",summary:"I-O Summary",wires:"Ferrule List",bom:"BOM",bom_lines:"BOM",devices:"Device List",devsummary:"Device Summary",symbols:"Symbols & Pins",
 terminals:"Terminal Schedule",blocks:"Terminal Blocks",cables:"Cable Schedule",xref:"Device Cross Reference",contacts:"Contact Cross Reference",coils:"Coil-Contact Mapping",
 signals:"Signal Links",sheetrefs:"Sheet References",panel_specs:"Panel Specifications",circuits:"Feeders - Circuits",annotations:"Sheet Annotations"};
const NOTES={io:"Rack, slot, module, DI/DO/AI/AO/RTD/TC, spare I/O, signal, tag, field device, cable and terminal. Click a cell to edit - edits are learned.",
 summary:"Channels, used and spare per PLC module.",
 wires:"Ferrule and wire numbers with From / To terminals, traced from the drawings, read from terminal-detail sheets, or derived for PLC terminals.",
 bom:"Printed BOM sheets plus catalogue parts on the schematics. Duplicate lines are merged and quantities totalled.",
 bom_lines:"Raw lines read from the printed BOM sheets. Corrections here update the BOM totals.",
 terminals:"Terminal block, number, incoming and outgoing wire, cable, core and terminal type. Spare terminals are flagged.",
 blocks:"Used and spare terminals per strip.",
 cables:"Cable number, type, cores, source, destination and length. Rows marked 'derived' or 'generated' were not printed on the drawing - check them.",
 devices:"Push buttons, selector switches, lamps, relays, contactors, MCB/MCCB, PLC modules, power supplies, HMI, VFD, sensors, transmitters, terminal blocks and other field devices.",
 devsummary:"Count per device type (tagged devices plus printed BOM quantities).",symbols:"Every symbol recognised on the schematics with its pin labels and rating.",
 xref:"Each device tag and the sheets it appears on.",contacts:"Every coil, contact (NO/NC with pins), main pole and overload with its page, column and printed cross-references.",
 coils:"Per relay / contactor: coil location and every contact, with printed references resolved to pages.",signals:"Sheet-to-sheet signal links printed on the drawings.",sheetrefs:"Which sheets refer to which.",
 panel_specs:"Panel details, general specifications, front-panel item schedule, internal layout, dimensions and drawing index.",circuits:"Motor feeders from the single line diagrams and legend sheets.",
 annotations:"All remaining printed text on each sheet with the nearest device, so nothing on a page is lost."};
const HEADS={rack:"PLC Rack",slot:"Slot",module_name:"Module",module_type:"Type",module_model:"Model",plc_address:"PLC Address",channel:"Ch.",tag:"Tag Name",description:"Signal Description",
 signal_type:"Signal Type",field_device:"Field Device",cable_no:"Cable No.",terminal:"Terminal No.",remarks:"Remarks",spare:"Spare",sheet:"Sheet",conf:"Confidence",source:"Source",
 feeder_no:"Feeder",rating_kw:"Rating",starter_type:"Starter",mcb:"MCB / MCCB",contactor:"Contactor",olr:"Overload",cable_size:"Cable Size",controls:"Controls",
 dev_class:"Device Type",make:"Manufacturer",part_no:"Part Number",rating:"Rating",catalogue_no:"Catalogue No.",descr:"Description",panel:"Panel Ref.",
 wire_no:"Wire No.",ferrule_no:"Ferrule No.",from_terminal:"From Terminal",to_terminal:"To Terminal",device_ref:"Device Ref.",cable_ref:"Cable Ref.",core_no:"Core No.",to_ref:"Link",
 strip:"Terminal Strip",terminal_no:"Terminal No.",terminal_type:"Terminal Type",incoming_wire:"Incoming Wire",outgoing_wire:"Outgoing Wire",signal_tag:"Signal Tag",
 cores:"Core Details",source_equipment:"Source Equipment",dest_equipment:"Destination Equipment",length_m:"Length (m)",cable_type:"Cable Type",
 item_no:"Item",qty:"Qty",uom:"UoM",category:"Section",property_name:"Parameter",property_value:"Value",unit:"Unit",raw_text:"Drawing Text"};
const HIDE={io:["module_model","channel","conf"],panel_specs:["raw_text"],wires:["to_ref"]};
const REVIEW_KEYS={io:"io",wires:"wires",cables:"cables",devices:"devices",bom:"bom",terminals:"terminals"};
const SRC={vector:"read",ocr:"OCR",drawing:"drawing",edited:"edited",manual:"manual",traced:"traced","terminal-sheet":"terminal sheet",derived:"derived","derived-io":"derived","ai-vision":"AI vision",symbol:"symbol",io:"from I/O",bom:"BOM sheet","bom-sheet":"BOM sheet"};
const head=c=>HEADS[c]||c.replaceAll("_"," ").replace(/\b\w/g,x=>x.toUpperCase());

let P=null,V="home",TAB=null,ENV={},AI={},OV=null,DOCS=[],state={q:"",flt:"",review:false,sort:null,limit:500},data=null,PV={doc:null,sheet:1,pages:1,zoom:100};

/* -------- routing -------- */
function goHome(){P=null;V="home";closePreview();render()}
function go(v,tab){V=v;const n=NAV.find(x=>x.id==v);TAB=tab||(n&&n.tabs?n.tabs[0][0]:null);state={q:"",flt:"",review:false,sort:null,limit:500};render()}
async function openProject(p){P=p;await refreshOverview();go("overview")}
let RT=0;   // render token: a slower async view never overwrites the one the user moved to
function render(){
 RT++;
 $("side").classList.toggle("on",!!P);$("hdrActs").style.display=P?"inline-flex":"none";
 $("crumb").innerHTML=P?`<span>/</span><b>${esc(P.name)}</b>`:"";
 renderNav();
 if(!P)return viewHome();
 ({overview:viewOverview,drawings:viewDrawings,learning:viewLearning}[V]||viewTable)();
}
function renderNav(){
 if(!P){$("side").innerHTML="";return}
 const t=(OV&&OV.tables)||{};let html="",g="";
 for(const n of NAV){
  if(n.grp!=g){g=n.grp;html+=`<div class="navh">${esc(g)}</div>`}
  const rk=REVIEW_KEYS[n.id];const cnt=rk&&t[rk]?t[rk][0]:"";const rv=rk&&t[rk]&&t[rk][1]?`<span class="rv" title="rows to review">${t[rk][1]}</span>`:"";
  html+=`<button class="navi ${V==n.id?"on":""}" onclick="go('${n.id}')"><span class="ix">${n.ix||""}</span>${esc(n.label)}${rv}<span class="num">${cnt}</span></button>`}
 $("side").innerHTML=html}

/* -------- home: project-wise database -------- */
async function viewHome(){
 const rt=RT;
 const ps=await api("/api/projects");
 if(rt!==RT)return;$("main").innerHTML=`<div class="view"><h1 class="t">Projects</h1><p class="lead">Each project keeps its drawings and all extracted engineering data. Open a project or create a new one, then upload the drawing PDFs.</p>
  <div class="tools"><button class="btn pri" onclick="newProject()">+ New project</button><input type="search" id="pq" placeholder="Search projects" oninput="filterProjects()" aria-label="Search projects"></div>
  <div class="grid" id="pgrid"></div></div>`;
 window._ps=ps;filterProjects()}
function filterProjects(){const q=($("pq")?.value||"").toLowerCase();const ps=(window._ps||[]).filter(p=>!q||(p.name+" "+(p.client||"")).toLowerCase().includes(q));

async function loadTable(){

 if(key=="learning")return;
 try{j=await api(`/api/projects/${P.id}/table/${key}?q=${encodeURIComponent(state.q)}&filter=${encodeURIComponent(state.flt)}&review=${state.review?1:0}`)}catch(e){$("tbl").innerHTML=`<div class="empty"><b>Could not load</b>${esc(e.message)}</div>`;return}

 if(j.filter_options&&j.filter_options.length){f.style.display="";f.innerHTML=`<option value="">All ${esc(head(j.filter_label).toLowerCase())}s</option>`+j.filter_options.map(o=>`<option ${o==state.flt?"selected":""}>${esc(SRC[o]||o)}</option>`).join("");

function drawTable(){
 const j=data;if(!j)return;
 const cnt=j.total;$("cnt").textContent=`${cnt} row${cnt==1?"":"s"}${state.review?" to review":""}`;
 if(!j.rows.length){$("tbl").innerHTML=`<div class="empty"><b>${state.q||state.flt||state.review?"No matching rows":"No data yet"}</b>${state.q||state.flt||state.review?"Clear the search or filters.":(DOCS.length?"Nothing of this kind was found on the drawings. You can add rows by hand.":"Upload drawing PDFs on the Drawings page.")}</div>`;return}
 let rows=j.rows.slice();const s=state.sort;
 if(j.editable){
  const cols=j.cols.filter(c=>!(HIDE[TAB]||[]).includes(c));
  if(s)rows.sort((a,b)=>cmp(a[s.c],b[s.c])*s.d);
  const vis=rows.slice(0,state.limit);
  $("tbl").innerHTML=`<table><thead><tr>${cols.map(c=>th(c,c)).join("")}<th></th></tr></thead><tbody>${vis.map(r=>`<tr data-id="${r.id}" class="${r._review?"review":""} ${r.spare=="1"?"spare":""}" title="${r._review?"Needs review":""}">${cols.map(c=>cell(c,r)).join("")}<td class="act"><button class="btn sm ghost danger" onclick="delRow(${r.id})" aria-label="Delete row">Delete</button></td></tr>`).join("")}</tbody></table>${more(rows.length)}`;
 }else{
  const idx=j.cols.map((c,i)=>i);
  if(s)rows.sort((a,b)=>cmp(a[s.c],b[s.c])*s.d);
  const vis=rows.slice(0,state.limit);
  $("tbl").innerHTML=`<table><thead><tr>${j.cols.map((c,i)=>th(c,i)).join("")}</tr></thead><tbody>${vis.map(r=>`<tr>${r.map((v,i)=>/^(sheet|sheet number|first sheet|coil sheet)$/i.test(j.cols[i])&&/^\d+$/.test(String(v))?`<td class="lnk" onclick="showSheet(null,${v})">${esc(v)}</td>`:`<td title="${esc(v)}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>${more(rows.length)}`}
 if(state.wrap)document.querySelector("#tbl table")?.classList.add("wrap")}
const cmp=(a,b)=>{const x=parseFloat(a),y=parseFloat(b);if(!isNaN(x)&&!isNaN(y)&&String(a).trim()!==""&&String(b).trim()!=="")return x-y;return String(a??"").localeCompare(String(b??""),undefined,{numeric:true})};
function th(label,c){const s=state.sort;const on=s&&s.c===c;return `<th onclick="sortBy(${typeof c=="number"?c:`'${c}'`})" title="Sort">${esc(typeof label=="string"&&HEADS[label]?HEADS[label]:head(String(label)))} ${on?`<span class="ar">${s.d>0?"▲":"▼"}</span>`:""}</th>`}
function sortBy(c){const s=state.sort;state.sort=s&&s.c===c?(s.d>0?{c,d:-1}:null):{c,d:1};drawTable()}
function more(n){return n>state.limit?`<div class="more"><button class="btn" onclick="state.limit+=1000;drawTable()">Show more (${n-state.limit} more rows)</button></div>`:""}
function cell(c,r){const v=r[c]??"";
 if(c=="sheet")return `<td class="lnk" onclick="showSheet(${r.doc_id},${parseInt(v)||1})" title="Preview this sheet">${esc(v)}</td>`;
 if(c=="source")return `<td><span class="pill src ${["derived","derived-io","ai-vision","terminal-sheet"].includes(v)?"rev":""}">${esc(SRC[v]||v)}</span></td>`;
 if(c=="spare")return `<td contenteditable="plaintext-only" data-f="${c}" data-v="${esc(v)}" onfocus="this.dataset.v=this.textContent" onblur="save(this)" onkeydown="keyEdit(event,this)">${v=="1"?"Yes":esc(v)}</td>`;

 $("pimg").src=`/api/preview/${PV.doc}/${PV.sheet}.png`;$("pimg").style.width=PV.zoom+"%";$("rr").style.display=AI.enabled?"":"none"}
function restorePreview(){if(PV.on&&PV.doc)drawPreview()}
function closePreview(){PV.on=false;const p=$("prev");if(p){p.classList.remove("on","full");$("split").classList.remove("on")}}
function page(d){if(!PV.on)return;const n=PV.sheet+d;if(n<1||n>PV.pages)return;PV.sheet=n;drawPreview()}
function gotoPage(v){const n=parseInt(v);if(n>=1&&n<=PV.pages){PV.sheet=n;drawPreview()}}
function zoom(d){PV.zoom=d==0?100:Math.max(50,Math.min(400,PV.zoom+d*25));$("pimg").style.width=PV.zoom+"%"}
function wireSplit(){const s=$("split");if(!s)return;s.onmousedown=e=>{e.preventDefault();const w=$("prev"),box=s.parentNode.getBoundingClientRect();
 const mv=ev=>{w.style.width=Math.max(320,Math.min(box.width-300,box.right-ev.clientX))+"px"};const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up)};
 document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up)}}
async function reread(){const mt=await choose("AI re-read of this sheet","The sheet's PLC channels are read again from the image and replace the current rows (flagged for review). Module type on this sheet:",["DI","DO","AI","AO","RTD","TC"]);
 if(!mt)return;toast("Reading the sheet with AI vision - this can take up to a minute...",60000);
 try{const r=await api(`/api/docs/${PV.doc}/sheet/${PV.sheet}/reread`,JSONP({module_type:mt}));toast(`AI read ${r.channels} channel(s). Review the flagged rows.`);if(V=="io")loadTable();refreshOverview()}catch(e){toast(e.message,6000)}}

/* -------- export -------- */
const EXPORT_GROUPS=[["Deliverables",["I-O List","I-O Summary","Ferrule List","BOM","Terminal Schedule","Terminal Blocks","Cable Schedule","Device List","Device Summary"]],
 ["Cross reference",["Device Cross Reference","Contact Cross Reference","Coil-Contact Mapping","Signal Links","Sheet References"]],
 ["Other data",["Feeders - Circuits","Panel Specifications","Drawing Register","Symbols & Pins","Sheet Annotations"]]];
async function openExport(){if(!P)return;const ds=await api(`/api/projects/${P.id}/datasets`);const cnt=Object.fromEntries(ds.map(d=>[d.name,d.rows]));
 const def=new Set(EXPORT_GROUPS[0][1].concat(EXPORT_GROUPS[1][1]).concat(["Panel Specifications","Feeders - Circuits"]));
 dialog(`<h3>Export engineering documents</h3><div class="meta">Choose the documents and the file format. Excel puts each document on its own worksheet.</div>
  ${EXPORT_GROUPS.map(([g,names])=>`<label class="f">${g}</label><div class="cols2">${names.filter(n=>n in cnt).map(n=>`<label class="chk"><input type="checkbox" class="exd" value="${esc(n)}" ${def.has(n)?"checked":""}> ${esc(n)}<span>${cnt[n]}</span></label>`).join("")}</div>`).join("")}
  <div style="margin-top:6px"><button class="btn sm ghost" onclick="document.querySelectorAll('.exd').forEach(c=>c.checked=true)">Select all</button><button class="btn sm ghost" onclick="document.querySelectorAll('.exd').forEach(c=>c.checked=false)">Clear</button></div>
  <label class="f">Format</label><div class="fmt"><label><input type="radio" name="fmt" value="xlsx" checked> Excel (.xlsx)</label><label><input type="radio" name="fmt" value="pdf"> PDF</label><label><input type="radio" name="fmt" value="csv"> CSV (.zip)</label><label><input type="radio" name="fmt" value="xml"> XML</label></div>
  <div class="acts"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="doExport()">Download</button></div>`)}
function doExport(){const t=[...document.querySelectorAll(".exd:checked")].map(c=>c.value);if(!t.length){toast("Select at least one document");return}
 const f=document.querySelector("input[name=fmt]:checked").value;location.href=`/api/export/${P.id}/${f}?tables=${encodeURIComponent(t.join("|"))}`;closeModal();toast("Preparing download...")}
function exportOne(key,fmt){location.href=`/api/export/${P.id}/${fmt}?tables=${encodeURIComponent(DS[key])}`}

/* -------- AI / status -------- */
async function loadStatus(){try{ENV=await api("/api/env")}catch(e){}try{AI=await api("/api/ai/status")}catch(e){AI={}}
 $("stAi").innerHTML=`<span class="dot ${AI.enabled?"ok":"warn"}"></span>AI ${AI.enabled?"on":"off"}`;$("stAi").title=AI.enabled?`Text: ${AI.fast_model} · Drawing images: ${AI.vision_model}`:(AI.hint||"No AI provider configured in .env");
 $("stOcr").innerHTML=`<span class="dot ${ENV.ocr?"ok":"warn"}"></span>OCR ${ENV.ocr?"ready":"not installed"}`;$("stOcr").title=ENV.ocr?"Tesseract found - scanned PDFs are read":"Install Tesseract-OCR to read scanned PDFs";
 $("stData").textContent=ENV.data_folder?"Data: "+ENV.data_folder:"";$("aiBtn").style.display=AI.enabled?"":"none"}
async function aiRun(){toast("Running the AI pass on all drawings...",60000);try{const r=await api(`/api/projects/${P.id}/ai/run`,{method:"POST"});toast(r.notes.join(" | ")||"AI pass finished - nothing needed filling",6000);render()}catch(e){toast(e.message,6000)}}

/* -------- dialogs -------- */
function dialog(html,focusId){$("dlg").innerHTML=html;$("modal").classList.add("on");setTimeout(()=>{const f=focusId?$(focusId):$("dlg").querySelector("button.pri");if(f)f.focus()},30)}
function closeModal(){$("modal").classList.remove("on");if(window._res){window._res(null);window._res=null}}
function confirmBox(title,text,ok){return new Promise(res=>{dialog(`<h3>${esc(title)}</h3><div class="meta" style="margin-top:6px">${esc(text)}</div><div class="acts"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="okb">${esc(ok||"OK")}</button></div>`);
 window._res=res;$("okb").onclick=()=>{window._res=null;$("modal").classList.remove("on");res(true)}})}
function choose(title,text,opts){return new Promise(res=>{dialog(`<h3>${esc(title)}</h3><div class="meta" style="margin:6px 0 12px">${esc(text)}</div><div class="fmt">${opts.map(o=>`<button class="btn" onclick="window._pick('${o}')">${o}</button>`).join("")}</div><div class="acts"><button class="btn" onclick="closeModal()">Cancel</button></div>`);
 window._res=res;window._pick=v=>{window._res=null;$("modal").classList.remove("on");res(v)}})}

/* -------- keyboard -------- */
document.addEventListener("click",()=>document.querySelectorAll(".menu.open").forEach(m=>m.classList.remove("open")));
document.addEventListener("keydown",e=>{
 const typing=/INPUT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable;
 if(e.key=="Escape"){if($("modal").classList.contains("on"))closeModal();else if(PV.on)closePreview()}
 if(e.key=="/"&&!typing){const q=$("q")||$("pq");if(q){e.preventDefault();q.focus()}}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=="e"&&P){e.preventDefault();openExport()}
 if(!typing&&PV.on&&(e.key=="ArrowLeft"||e.key=="ArrowRight")){e.preventDefault();page(e.key=="ArrowLeft"?-1:1)}});

loadStatus();render();
</script>
</body>
</html>
